# Janitza UMG 96RM-E — Modbus register map for Omni Console
#
# Source: janitza-mal-umg96rme-en.pdf ("Modbus address list", float block).
# - All measured values are IEEE-754 FLOAT (f32), 2 registers, Big-Endian — the
#   default — so `word_order` is omitted. (Janitza also exposes the same values
#   Little-Endian at address + 32768.) Values are already in engineering units
#   (transformer factors applied internally), so no scale.
# - Measured values update every 200 ms. Read with FC03 (holding) or FC04 (input).
# - Factory defaults: device address (slave) = 1, RTU = 38.4 kbps, 8N1.
# - Addresses are the Modbus protocol addresses, in decimal, as printed in the
#   manual (float block starts at 19000).
#
# Workspace fields below activate in Phase 1 (currently ignored by the build):
# pinned = [19000, 19012, 19026, 19050, 19060]
# poll_interval_ms = 1000
# slave = 1

vendor = "Janitza"
model = "UMG 96RM-E"
description = "Power analyser — instantaneous V/I/P/Q/S, CosPhi, frequency, THD and energy totals (IEEE-754 float, BE)."

# ----- Voltages, phase-to-neutral -----
[[registers]]
address = 19000
type = "f32"
name = "Voltage L1-N"
unit = "V"

