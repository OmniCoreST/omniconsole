# ATO RS485 to 4-20mA/0-5V/0-10V Converter — 4 Channel
#
# Source: ato-rs485-4-20ma-0-10v-converter-4ch-modbus.pdf
# - 4-channel analog output module (current or voltage, selectable per hardware jumper).
# - Modbus RTU, FC03/04/06, 8N1, factory default 4800 baud, slave address 1.
# - All addresses are raw protocol addresses (0x0000 = 0 decimal).
# - Channel values: u16, 12-bit DAC, range 0–4095.
#   4-20mA: mA = (Rx/4095)×16 + 4; 0-5V: V = (Rx/4095)×5; 0-10V: V = (Rx/4095)×10.

vendor = "ATO"
model = "RS485 4-Channel Analog Output"
description = "4-channel RS485 Modbus RTU analog output module (4-20mA / 0-5V / 0-10V selectable); 12-bit DAC, raw 0–4095 per channel (FC03/06, 8N1, 4800 baud default)."

[[registers]]
address = 0
type = "u16"
name = "Channel 1 output value"

[[registers]]
address = 1
type = "u16"
name = "Channel 2 output value"

[[registers]]
address = 2
type = "u16"
name = "Channel 3 output value"

[[registers]]
address = 3
type = "u16"
name = "Channel 4 output value"
