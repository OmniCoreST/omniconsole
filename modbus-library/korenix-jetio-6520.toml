# Korenix JetI/O 6520 Industrial Intelligent Ethernet I/O Server
#
# Source: JetI/O 6520 User's Manual V0.1 (Jan. 2008)
# Protocol: Modbus/TCP (Ethernet port 502); FC03 read holding, FC06 write single
# Module: 4-channel analog output, 16-bit
# Output ranges (set globally at addr 9):
#   0 = 0~+10V  (0~10000 = 0~10V)
#   1 = -10V~+10V  (-10000~10000 = -10V~+10V)
#   2 = 0~20mA  (0~20000 = 0~20mA)
# Slew rate (addr 8): 4-bit code per channel packed into one register (ABCD = ch3,ch2,ch1,ch0).
# Power-on DA values (addr 10-13): stored output value applied on power-up.

vendor = "Korenix"
model = "JetI/O 6520"
description = "4-CH analog output Ethernet I/O server, Modbus/TCP. Output range set globally at addr 9 (0=0~+10V, 1=-10V~+10V, 2=0~20mA). Output values at addr 22-25 (s16; 0-10000=0-10V, ±10000=±10V, 0-20000=0-20mA). Slew rate at addr 8 (4-bit code per channel). Power-on values at addr 10-13. Calibration offset/span at addr 14-21."

# ===== Common Holding Registers (FC03) =====

[[registers]]
address = 0
type = "u16"
name = "Watchdog enable (0x0000=disable 0xFF00=enable)"

[[registers]]
address = 1
type = "u16"
name = "Watchdog cycle count (BB×0.1s, range 1-255)"

[[registers]]
address = 2
type = "u16"
name = "Host-watchdog status (R: 0x0000=OK 0xFF00=fail; W: 0xFF00=reset)"

[[registers]]
address = 3
type = "u16"
name = "Firmware version (reads 0xF20A = 6520 firmware)"

[[registers]]
address = 4
type = "u16"
name = "Module name (reads 0x6520)"

[[registers]]
address = 5
type = "u16"
name = "Reset status (0x0000 after read; 0x0001 after reset)"

[[registers]]
address = 6
type = "u16"
name = "Reserved (always 0)"

[[registers]]
address = 7
type = "u16"
name = "Reserved (always 0)"

[[registers]]
address = 8
type = "u16"
name = "DA slew rate code (4-bit per ch: ABCD=ch3,ch2,ch1,ch0; 0=immediate)"

[[registers]]
address = 9
type = "u16"
name = "Output range per channel (ABCD bits; 0=0~+10V 1=-10~+10V 2=0~20mA)"

[[registers]]
address = 10
type = "u16"
name = "Power-on DA value channel 0"

[[registers]]
address = 11
type = "u16"
name = "Power-on DA value channel 1"

[[registers]]
address = 12
type = "u16"
name = "Power-on DA value channel 2"

[[registers]]
address = 13
type = "u16"
name = "Power-on DA value channel 3"

[[registers]]
address = 14
type = "u16"
name = "DA offset calibration channel 0 (write 0xFF00)"

[[registers]]
address = 15
type = "u16"
name = "DA span calibration channel 0 (write 0xFF00)"

[[registers]]
address = 16
type = "u16"
name = "DA offset calibration channel 1 (write 0xFF00)"

[[registers]]
address = 17
type = "u16"
name = "DA span calibration channel 1 (write 0xFF00)"

[[registers]]
address = 18
type = "u16"
name = "DA offset calibration channel 2 (write 0xFF00)"

[[registers]]
address = 19
type = "u16"
name = "DA span calibration channel 2 (write 0xFF00)"

[[registers]]
address = 20
type = "u16"
name = "DA offset calibration channel 3 (write 0xFF00)"

[[registers]]
address = 21
type = "u16"
name = "DA span calibration channel 3 (write 0xFF00)"

# ===== Analog Output Value Registers (FC03 R/W) =====

[[registers]]
address = 22
type = "s16"
name = "Analog output channel 0 value"

[[registers]]
address = 23
type = "s16"
name = "Analog output channel 1 value"

[[registers]]
address = 24
type = "s16"
name = "Analog output channel 2 value"

[[registers]]
address = 25
type = "s16"
name = "Analog output channel 3 value"

[[registers]]
address = 26
type = "u16"
name = "Positive trim channel N (write 0ABB: A=ch 0-3, BB=trim count 0-FF)"

[[registers]]
address = 27
type = "u16"
name = "Negative trim channel N (write 0ABB: A=ch 0-3, BB=trim count 0-FF)"
