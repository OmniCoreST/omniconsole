# Lovato DMG210 — Modbus register map for Omni Console
#
# Source: lovato-dmg-modbus-i317.pdf (Doc. I317IGB02_22, 07/02/2022)
# - 3-phase 4-wire power analyzer, DIN-rail, RS485 Modbus RTU.
# - Holding registers (FC03); FC04 also accepted.
# - UINT32/INT32 little-endian (LSW first), word_order = "le".
# - Protocol address = table hex address − 1 (document states this explicitly).
# - Identical register layout to DMG110; frequency scale is 0.01 Hz (×0.01).
# - Factory defaults: slave=1, configurable baud, 8N1.

vendor = "Lovato"
model = "DMG210"
description = "3-phase 4-wire power analyzer — per-phase V/I/P/Q/S/PF, frequency (0.01 Hz), holding registers (UINT32/INT32 LSW-first)."

# ----- Phase-to-neutral voltages -----
[[registers]]
address = 1
type = "u32"
word_order = "le"
name = "Voltage L1-N"
unit = "V"
scale = 0.01

[[registers]]
address = 3
type = "u32"
word_order = "le"
name = "Voltage L2-N"
unit = "V"
scale = 0.01

[[registers]]
