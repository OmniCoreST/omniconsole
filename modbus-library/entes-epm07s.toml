type = "u16"
name = "Current L2"
unit = "A"
scale = 0.001

[[registers]]
address = 9
type = "u16"
name = "Current L3"
unit = "A"
scale = 0.001

[[registers]]
address = 11
type = "u16"
name = "Neutral current"
unit = "A"
scale = 0.001

