# Advantech ADAM-4018+ — 8-Channel Thermocouple Temperature Input Module
#
# Source: advantech-adam-4000-modbus.pdf (Appendix G, Module 2)
# - 8-channel thermocouple temperature input, Modbus RTU.
# - FC02 00201-00208 (addr 200-207): Burn-out Signal ch0-7 (0=Normal, 1=Burn-out).
# - FC03 40001-40008 (addr 0-7): Current Value ch0-7 (s16, ×0.1°C).
# - FC03 40201-40208 (addr 200-207): Type Code ch0-7, R/W.
# - FC03 40211 (addr 210): Module Name; 40221 (addr 220): Channel Enable bitmask.
# - Factory defaults: slave=1, 9600 baud, 8N1.

vendor = "Advantech"
model = "ADAM-4018+"
description = "8-channel thermocouple temperature input module (s16 ×0.1°C, FC03, addr 0-7). Burn-out status via FC02 addr 200-207. Type code configuration at addr 200-207 (FC03, R/W)."

# ----- Measurement (FC03, read-only) -----
[[registers]]
address = 0
type = "s16"
name = "TC Ch0 temperature"
unit = "°C"
scale = 0.1

[[registers]]
address = 1
type = "s16"
name = "TC Ch1 temperature"
unit = "°C"
scale = 0.1

