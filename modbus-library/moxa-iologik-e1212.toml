# Moxa ioLogik E1212 Remote Ethernet I/O — 8 DIs + 8 DIOs
#
# Source: ioLogik E1200 Series User Manual V16.2, August 2025 (Appendix A)
# Protocol: Modbus/TCP (port 502); Modbus/TCP ID default = 1
#
# DI channels (ch0-7): FC02/FC04/FC01 spaces
#   FC02 addr 0-7: DI_status (R)
#   FC02 addr 1000-1007: DI_counterOverflowFlag (R)
#   FC01 addr 256-263: DI_counterStatus (R/W)
#   FC01 addr 272-279: DI_counterReset (R/W)
#   FC01 addr 288-295: DI_counterOverflowFlagClear (R/W)
#   FC04 addr 16-31 (2 words/ch): DI_counterValue u32 (R)
#   FC04 addr 48: DI-all_statusFromDI-00 (word, R)
# DIO/DO channels (ch0-7): FC01/FC02/FC03 spaces
#   FC01 addr 0-7: DO_status (R/W)
#   FC01 addr 16-23: DO_pulseStatus (R/W)
#   FC02 addr 4096-4103: DO_p2pStatus (R)
#   FC02 addr 4112-4119: DO_p2pSafeModeFlag (R)
#   FC01 addr 4128-4135: DO_p2pSafeModeFlagClear (R/W)
# FC01 addr 4144: watchdogAlarmFlag (R/W)

vendor = "Moxa"
model = "ioLogik E1212"
description = "8-DI + 8-DIO remote Ethernet I/O, Modbus/TCP. DI FC02: DI_status (addr 0-7), DI_counterOverflowFlag (addr 1000-1007). DI FC01: DI_counterStatus (256), DI_counterReset (272), DI_counterOverflowFlagClear (288). DI FC04: DI_counterValue u32 (addr 16-31), DI-all_status (addr 48). DIO FC01: DO_status (0-7), DO_pulseStatus (16-23). FC03: DO_all_status (32), DO_pulseCount ch0-7 (36-43), DO_pulseOnWidth unit 1ms (52-59), DO_pulseOffWidth unit 1ms (68-75)."

# ===== FC03 Holding Registers (DIO output channels) =====

[[registers]]
address = 32
type = "u16"
name = "DO_all_statusFromDO-00 (packed DO ch0-7 bits as word; 0=OFF 1=ON; R/W)"

