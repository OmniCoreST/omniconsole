# LC Technology LC-Modbus-8R-D7 8-Channel Modbus RTU Relay Module
#
# Source: lctech-modbus-rtu-relay-8ch-register-table.html (chinalctech.com product page)
# Protocol: Modbus RTU; RS485 or 5V TTL UART; 4800/9600/19200 baud, default 9600
# Device address: 1-255, default 255 (0xFF); address 0x00 = broadcast
#
# FC05 (Write Single Coil): relay 1-8 at coil addresses 0x0000-0x0007 (0xFF00=ON, 0x0000=OFF)
# FC0F (Write Multiple Coils): addr 0x0000, count 8; data byte bit0-7 = relay 1-8
# FC01 (Read Coils): addr 0x0000, count 8; returns relay 1-8 state (bit0=relay1)
# FC02 (Read Discrete Inputs): addr 0x0000, count 8; optocoupler 1-8 state (bit0=ch1)
# FC03 (Read Holding Registers): device address (addr 0), baud rate status (addr 1000)
# FC10 (Write Multiple Registers): device address (addr 0), baud rate (addr 1001),
#        relay flash/delay mode (addr 3/8/13/18/23/28/33/38, 2 regs each)
#
# Flash mode (FC10, 2 registers at relay's base address):
#   Word 1 = 0x0004: flash-OFF (turn ON then OFF after delay)
#   Word 1 = 0x0002: flash-ON  (turn OFF then ON after delay)
#   Word 2 = delay value (×0.1s, max 0xFFFF = 6553.5s)

vendor = "LC Technology"
model = "LC-Modbus-8R-D7"
description = "8-CH Modbus RTU relay + optocoupler input module, RS485/5V TTL, 4800/9600/19200 baud. FC05/FC01: relay ch1-8 at coil addr 0-7 (0xFF00=on/0x0000=off). FC02: optocoupler input ch1-8 at discrete input addr 0-7. FC03 addr 0: device address R (1-255). FC03 addr 1000: baud rate status (2=4800,3=9600,4=19200). FC10 addr 1001: set baud rate. FC10 relay N flash mode: base addr=3+(N-1)*5, 2 regs (word1: 0x0004=flash-OFF, 0x0002=flash-ON; word2=delay×0.1s)."

# ===== Configuration Holding Registers (FC03/FC10) =====

[[registers]]
address = 0
type = "u16"
name = "Device address R/W (range 1-255; default 255; write via FC10 from broadcast addr 0)"

[[registers]]
address = 1000
type = "u16"
name = "Baud rate status R (0x02=4800 0x03=9600 0x04=19200)"

[[registers]]
address = 1001
type = "u16"
name = "Baud rate set W (0x02=4800 0x03=9600 0x04=19200; write via FC10)"

# ===== Relay Flash Mode Registers (FC10, 2 regs per relay, base = 3 + (N-1)*5) =====

[[registers]]
address = 3
type = "u16"
name = "Relay 1 flash mode (FC10 W: 0x0004=flash-OFF 0x0002=flash-ON)"

[[registers]]
address = 4
type = "u16"
name = "Relay 1 flash delay (×0.1s; max 0xFFFF=6553.5s)"

[[registers]]
address = 8
type = "u16"
name = "Relay 2 flash mode (FC10 W: 0x0004=flash-OFF 0x0002=flash-ON)"

[[registers]]
address = 9
type = "u16"
name = "Relay 2 flash delay (×0.1s)"

[[registers]]
