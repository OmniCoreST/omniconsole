# Moxa ioLogik R1240 Remote RTU I/O — 8-channel AI
#
# Source: ioLogik R1200 Series User Manual V3.2, November 2017 (Appendix)
# Protocol: Modbus RTU (RS-485); 9600 8N1 default, address configurable via software
#
# AI channels (ch0-7):
#   FC03 addr 0x02C0-0x02C7 (704-711): AI range ch0-7 (0=0-10V, 1=0-20mA, 2=4-20mA burnout)
#   FC03 addr 0x02E0,0x02E2...0x02EE (736,738,...750): AI burnout value ch0-7 (f32, 2 words/ch, step-2)
#   FC04 addr 0x02C0-0x02C7 (704-711): AI raw value ch0-7
#   FC04 addr 0x02E0-0x02E7 (736-743): AI min raw value ch0-7
#   FC04 addr 0x0300-0x0307 (768-775): AI max raw value ch0-7
#   FC04 addr 0x0320,0x0322...0x032E (800,802,...814): AI eng. value ch0-7 (f32, step-2 pairs)
#   FC04 addr 0x0360,0x0362...0x036E (864,866,...878): AI min eng. value ch0-7 (f32, step-2 pairs)
#   FC04 addr 0x03A0,0x03A2...0x03AE (928,930,...942): AI max eng. value ch0-7 (f32, step-2 pairs)
#   FC04 addr 0x03E0-0x03E7 (992-999): AI status ch0-7 (0=normal,1=burnout,2=over-range,3=under-range)
#   FC01 addr 0x02C0-0x02C7 (704-711): AI reset min value; addr 0x02E0-0x02E7 (736-743): AI reset max value

vendor = "Moxa"
model = "ioLogik R1240"
description = "8-AI remote RTU I/O, Modbus RTU RS-485 9600 8N1. FC03: AI_range ch0-7 (704-711, 0=0-10V 1=0-20mA 2=4-20mA-burnout), AI_burnoutValue f32 ch0-7 (736,737,738,...751 step-2 pairs). FC04: AI_rawValue (704-711), AI_rawValueMin (736-743), AI_rawValueMax (768-775), AI_engValue f32 step-2 (800-815), AI_engValueMin f32 step-2 (864-879), AI_engValueMax f32 step-2 (928-943), AI_status (992-999, 0=normal 1=burnout 2=over 3=under). FC01: AI_resetMinValue (704-711), AI_resetMaxValue (736-743)."

# ===== FC03 Holding Registers =====

# AI range ch0-7
[[registers]]
address = 704
type = "u16"
name = "AI_range ch0 (0=0-10V, 1=0-20mA, 2=4-20mA burnout; R/W)"

[[registers]]
address = 705
type = "u16"
name = "AI_range ch1"

