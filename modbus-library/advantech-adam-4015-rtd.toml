# Advantech ADAM-4015 — 6-Channel RTD Temperature Input Module
#
# Source: advantech-adam-4000-modbus.pdf (Appendix G, Module 1)
# - 6-channel RTD temperature input, Modbus RTU.
# - FC02 00201-00206 (addr 200-205): Burn-out Signal ch0-5 (0=Normal, 1=Burn-out).
# - FC03 40001-40006 (addr 0-5): Current Value ch0-5 (s16, ×0.1°C).
# - FC03 40201-40206 (addr 200-205): Type Code ch0-5, R/W.
# - FC03 40211 (addr 210): Module Name; 40221 (addr 220): Channel Enable bitmask.
# - Factory defaults: slave=1, 9600 baud, 8N1.

vendor = "Advantech"
model = "ADAM-4015"
description = "6-channel RTD temperature input module (s16 ×0.1°C, FC03, addr 0-5). Burn-out status via FC02 addr 200-205. Type code configuration at addr 200-205 (FC03, R/W)."

# ----- Measurement (FC03, read-only) -----
[[registers]]
address = 0
type = "s16"
name = "RTD Ch0 temperature"
unit = "°C"
scale = 0.1

[[registers]]
address = 1
type = "s16"
name = "RTD Ch1 temperature"
unit = "°C"
scale = 0.1

[[registers]]
address = 2
type = "s16"
name = "RTD Ch2 temperature"
unit = "°C"
scale = 0.1

[[registers]]
address = 3
type = "s16"
name = "RTD Ch3 temperature"
unit = "°C"
scale = 0.1

[[registers]]
address = 4
type = "s16"
name = "RTD Ch4 temperature"
unit = "°C"
scale = 0.1

[[registers]]
address = 5
type = "s16"
name = "RTD Ch5 temperature"
unit = "°C"
scale = 0.1

# ----- Configuration (FC03, R/W) -----
[[registers]]
address = 200
type = "u16"
name = "Ch0 type code"

[[registers]]
address = 201
type = "u16"
name = "Ch1 type code"

[[registers]]
address = 202
type = "u16"
name = "Ch2 type code"

[[registers]]
address = 203
type = "u16"
name = "Ch3 type code"

[[registers]]
address = 204
type = "u16"
name = "Ch4 type code"

[[registers]]
address = 205
type = "u16"
name = "Ch5 type code"

[[registers]]
address = 210
type = "u16"
name = "Module name"

[[registers]]
address = 220
type = "u16"
name = "Channel enable bitmask"
