# Eastron SDM120 — Modbus register map for Omni Console
#
# Source: eastron-sdm120-modbus-protocol.pdf (SDM120 Modbus Protocol V2.4)
# Single-phase DIN-rail energy meter; direct connection up to 45A.
# All measured values are IEEE-754 FLOAT (f32), MSW first (big-endian) — word_order omitted.
# Measurements use INPUT registers (FC04). Addresses are 0-based protocol addresses
# (manual shows 30001-based: subtract 30001 to get protocol address).
# Factory defaults: slave=1, baud=2400 (default per protocol doc), 8N1.
# Note: baud default is 2400 per holding register table (code 0=2400).

vendor = "Eastron"
model = "SDM120"
description = "Single-phase DIN-rail smart meter — V/I/P/Q/S, PF, frequency, import/export energy (IEEE-754 float, input registers)."

# ----- Voltage -----
[[registers]]
address = 0
area = "input"
type = "f32"
name = "Voltage"
unit = "V"

# ----- Current -----
[[registers]]
address = 6
area = "input"
type = "f32"
name = "Current"
unit = "A"

