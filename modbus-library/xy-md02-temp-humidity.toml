# XY-MD02 Temperature & Humidity Sensor — Modbus register map for Omni Console
#
# Source: xy-md02-temp-humidity-modbus.pdf
# - SHT20-based temperature and humidity sensor, RS485 Modbus RTU.
# - Input registers (FC04) for measurements; holding registers (FC03) for config.
# - All addresses are 1-based protocol addresses (as shown in example command frames).
# - Temperature is signed (negative values use 2's complement).
# - Factory defaults: slave=1, baud=9600, 8N2 (2 stop bits).

vendor = "XY-MD02"
model = "XY-MD02"
description = "SHT20-based RS485 temperature and humidity sensor — temperature (s16 ×0.1°C), humidity (u16 ×0.1%RH), input registers."

# ----- Measurements (FC04 input registers) -----
[[registers]]
address = 1
type = "s16"
area = "input"
name = "Temperature"
unit = "°C"
scale = 0.1

[[registers]]
address = 2
type = "u16"
area = "input"
name = "Humidity"
unit = "%RH"
scale = 0.1
