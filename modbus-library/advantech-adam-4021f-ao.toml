# Advantech ADAM-4021-F — 1-Channel Analog Output Module
#
# Source: advantech-adam-4000-modbus.pdf (Appendix G, Module 5)
# - 1-channel analog output (4-20mA / 0-20mA / 0-10V / 0-5V selectable via type code).
# - Modbus RTU, FC03/FC06.
# - FC03 40001 (addr 0): Current Output Value (u16, 0-0xFFF, R/W).
# - FC03 40201 (addr 200): Type Code (R/W).
# - FC03 40215 (addr 214): Watchdog Timer (R/W).
# - FC03 40216 (addr 215): Safety Flag (R/W).
# - FC03 40221 (addr 220): Startup Value (u16, 0-0xFFF, R/W).
# - FC03 40223 (addr 222): Slew Rate (R/W).
# - FC03 40231 (addr 230): Safety Value (u16, 0-0xFFF, R/W).
# - Factory defaults: slave=1, 9600 baud, 8N1.

vendor = "Advantech"
model = "ADAM-4021-F"
description = "1-channel analog output module (4-20mA/0-20mA/0-10V/0-5V, u16 12-bit 0-4095 raw, FC03/FC06, addr 0). Output range set by type code at addr 200."

# ----- Output (FC03, R/W) -----
[[registers]]
address = 0
type = "u16"
name = "Channel 0 output value"

# ----- Configuration (FC03, R/W) -----
[[registers]]
address = 200
type = "u16"
name = "Type code"

[[registers]]
address = 214
type = "u16"
name = "Watchdog timer"

[[registers]]
address = 215
type = "u16"
name = "Safety flag"

[[registers]]
address = 220
type = "u16"
name = "Startup value"

[[registers]]
address = 222
type = "u16"
name = "Slew rate"

[[registers]]
address = 230
type = "u16"
name = "Safety value"
