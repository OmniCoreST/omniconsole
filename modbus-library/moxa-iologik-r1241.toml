# Moxa ioLogik R1241 Remote RTU I/O — 4-channel AO
#
# Source: ioLogik R1200 Series User Manual V3.2, November 2017 (Appendix)
# Protocol: Modbus RTU (RS-485); 9600 8N1 default, address configurable via software
#
# AO channels (ch0-3) — ALL registers are FC03; no FC01/FC02/FC04 for AO control:
#   FC03 addr 0x04A0-0x04A3 (1184-1187): AO raw value ch0-3 (0 to 4095; R/W)
#   FC03 addr 0x04C0-0x04C3 (1216-1219): AO power-on raw value ch0-3 (R/W)
#   FC03 addr 0x04E0-0x04E3 (1248-1251): AO safe-mode raw value ch0-3 (R/W)
#   FC03 addr 0x0500-0x0503 (1280-1283): AO range ch0-3 (0=0-10V, 1=0-20mA; R/W)

vendor = "Moxa"
model = "ioLogik R1241"
description = "4-AO remote RTU I/O, Modbus RTU RS-485 9600 8N1. All AO registers are FC03 only (no FC01/FC02/FC04 AO space). FC03: AO_rawValue ch0-3 (1184-1187, 0-4095), AO_powerOnRawValue ch0-3 (1216-1219), AO_safeModeRawValue ch0-3 (1248-1251), AO_range ch0-3 (1280-1283, 0=0-10V 1=0-20mA)."

# ===== FC03 Holding Registers =====

# AO raw value ch0-3 (0 to 4095)
[[registers]]
address = 1184
type = "u16"
name = "AO_rawValue ch0 (0-4095; R/W)"

[[registers]]
address = 1185
type = "u16"
name = "AO_rawValue ch1"

[[registers]]
address = 1186
type = "u16"
name = "AO_rawValue ch2"

[[registers]]
address = 1187
type = "u16"
name = "AO_rawValue ch3"

# AO power-on raw value ch0-3
[[registers]]
address = 1216
type = "u16"
name = "AO_powerOnRawValue ch0 (R/W)"

[[registers]]
address = 1217
type = "u16"
name = "AO_powerOnRawValue ch1"

[[registers]]
address = 1218
type = "u16"
name = "AO_powerOnRawValue ch2"

[[registers]]
address = 1219
type = "u16"
name = "AO_powerOnRawValue ch3"

# AO safe-mode raw value ch0-3
[[registers]]
address = 1248
type = "u16"
name = "AO_safeModeRawValue ch0 (R/W)"

[[registers]]
address = 1249
type = "u16"
name = "AO_safeModeRawValue ch1"

[[registers]]
address = 1250
type = "u16"
name = "AO_safeModeRawValue ch2"

[[registers]]
address = 1251
type = "u16"
name = "AO_safeModeRawValue ch3"

# AO range ch0-3
[[registers]]
address = 1280
type = "u16"
name = "AO_range ch0 (0=0-10V, 1=0-20mA; R/W)"

[[registers]]
address = 1281
type = "u16"
name = "AO_range ch1"

[[registers]]
address = 1282
type = "u16"
name = "AO_range ch2"

[[registers]]
address = 1283
type = "u16"
name = "AO_range ch3"
