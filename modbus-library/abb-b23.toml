# ABB B23 — Modbus register map for Omni Console
#
# Source: abb-b23-b24-manual.pdf (2CMC485003M0201 Rev. A)
# - 3-phase 4-wire energy meter, RS485 Modbus.
# - Holding registers (FC03); addresses are direct 0-based protocol addresses
#   (do NOT subtract 40000 or decrement by 1).
# - Measurements: mixed u32/s32 (2 registers) and u16/s16 (1 register).
# - Energy registers at 0x5000+ are 64-bit (4 registers) — not included here.
#   DMTME-compatible 32-bit energy totals at 0x103E/0x1040 are used instead.
# - Scales: V×0.1, A×0.01, W/VAr/VA×0.01, PF×0.001, Hz×0.01, energy×0.1 kWh.
# - Factory defaults: slave=1, baud=9600, 8N1.

vendor = "ABB"
model = "B23"
description = "3-phase 4-wire energy meter (1/2/3-element) — per-phase V/I/P/Q/S, PF, Hz, 32-bit energy totals (DMTME-compatible) — holding registers, mixed integer types."

# ----- Phase-to-neutral voltages (0x5B00+, u32, ×0.1 V) -----
[[registers]]
address = 23296
type = "u32"
name = "Voltage L1-N"
unit = "V"
scale = 0.1

[[registers]]
address = 23298
type = "u32"
name = "Voltage L2-N"
unit = "V"
scale = 0.1

[[registers]]
address = 23300
type = "u32"
name = "Voltage L3-N"
unit = "V"
scale = 0.1

