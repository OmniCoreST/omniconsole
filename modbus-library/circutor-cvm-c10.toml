# Circutor CVM-C10 — Panel-Mount 3-Phase Power Analyzer (Modbus RTU / BACnet RS-485)
#
# Source: circutor-cvm-c10-instruction-manual.pdf (section 4.10.3, pp. 74-83)
# Models: CVM-C10-ITF, CVM-C10-ITF-IN, CVM-C10-MC, CVM-C10-MC-IN, CVM-C10-mV, CVM-C10-FLEX
# Protocol: Modbus RTU or BACnet MS/TP; FC03/04 read, FC10 write
# Baud: 9600/19200 bps (configurable)
# All MODBUS addresses are hexadecimal in source; converted to decimal here.
# All measurement parameters are s32 (2 consecutive registers, 32-bit signed).
# Scaling: V×10, current in mA, Hz×100, PF×100, THD %×10.
# Energy registers are u32 (2 regs). Three tariffs + Total; Total column mapped here.
# Harmonics (Tables 21/22): Fundamental is s32 (2 regs); harmonics 2-31 are u16 single regs.

vendor = "Circutor"
model = "CVM-C10"
description = "3-phase panel power analyzer, Modbus RTU/BACnet RS-485. FC03/04 read, FC10 write. Phase V(×10)/I(mA)/P/Q(L+C)/kVA/PF/cosφ per phase (s32) at addr 0-46; 3-phase totals at 48-58; Hz/THD/max demand at 60-92. Total energy (u32) consumed/generated at 220-260. Voltage fundamental harmonics s32 at 2600/2632/2664; current at 2696/2728/2760 (harmonics 2-31 as u16 at consecutive addr). Comms config at 10050. TX ratios at 10000."

