# Eastron SDM630MCT — Modbus register map for Omni Console
#
# Source: eastron-sdm630mct-modbus-protocol.pdf
# - 3-phase 4-wire energy meter with CT inputs (5A secondary).
# - Input registers (FC04), IEEE-754 float, big-endian (MSW first).
# - All addresses are 0-based protocol addresses (register_number − 30001).
# - Energy in kWh/kVArh, power in W/VA/VAr, voltage in V, current in A.
# - Factory defaults: slave=1, baud=9600, 8N1.

vendor = "Eastron"
model = "SDM630MCT"
description = "3-phase 4-wire CT-connected energy meter — full per-phase V/I/P/Q/S/PF, totals, THD, demand, import/export energy per phase (IEEE-754 float, input registers)."

