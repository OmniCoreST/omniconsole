# Carlo Gavazzi EM24 (DIN / E1) — Modbus register map for Omni Console
#
# Source: Carlo Gavazzi "EM24 Communication Protocol" (instantaneous-variables
# table, function codes 03h/04h — both return the same data).
# - Multi-register integers (INT32/UINT32) are sent LEAST-significant word first,
#   so every 32-bit value needs `word_order = "le"`. Byte order inside each word
#   is MSB->LSB (normal). Single-register INT16/UINT16 values need no word order.
# - "Value weight" from the manual is folded into `scale`:
#       Volt*10   -> 0.1     Ampere*1000 -> 0.001   Watt/VA/var*10 -> 0.1
#       PF*1000   -> 0.001   Hz*10       -> 0.1      kWh/kvarh*10   -> 0.1
# - Addresses are the physical (word) addresses, in decimal (0x0000 = 0).
# - Factory defaults: device address (slave) = 1, RTU = 9600 baud, 8N1.
#
# Workspace fields below activate in Phase 1 (currently ignored by the build):
# pinned = [0, 12, 40, 51, 52]
# poll_interval_ms = 1000
# slave = 1

vendor = "Carlo Gavazzi"
model = "EM24"
description = "3-phase energy analyser — V/I/P/Q/S per phase and total, power factor, frequency and energy meters (scaled 16/32-bit integers, LSW-first)."

# ----- Voltages, phase-to-neutral -----
[[registers]]
address = 0
type = "s32"
name = "Voltage L1-N"
unit = "V"
word_order = "le"
scale = 0.1

[[registers]]
address = 2
type = "s32"
name = "Voltage L2-N"
unit = "V"
word_order = "le"
scale = 0.1

