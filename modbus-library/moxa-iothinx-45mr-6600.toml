# Moxa ioThinx 45MR-6600 — 6-channel RTD input
#
# Source: ioThinx 4510 Series User's Manual V2.1, August 2019, Appendix A
# Protocol: Modbus/TCP via ioThinx 4510 adapter, port 502
#
# IMPORTANT: Addresses are MODULE-RELATIVE. Actual PDU address = slot_base + relative_address.
# Slot base depends on which slot this module occupies in the ioThinx 4510 chassis.
#
# FC01 (coil R/W): rtdResetMinValue ch0-5 (6 BOOL, W=1 to reset min tracking),
#   rtdResetMaxValue ch0-5 (6 BOOL, W=1 to reset max tracking)
# FC03 (holding R/W): see [[registers]] below
# FC04 (input R): rtdValueScaled ch0-5 (f32, 2 regs/ch = 12 regs),
#   rtdValueScaledMin ch0-5 (f32, 12 regs), rtdValueScaledMax ch0-5 (f32, 12 regs),
#   rtdType ch0-5 (6 WORD, 0=PT50 1=PT100 2=PT200 3=PT500 4=PT1000
#     14=310Ohm 15=620Ohm 16=1250Ohm 17=2200Ohm
#     20=JPT100 21=JPT200 22=JPT500 23=JPT1000
#     30=NI100 31=NI200 32=NI500 33=NI1000 34=NI120),
#   rtdStatus ch0-5 (6 WORD, 0=normal 1=burnout)

vendor = "Moxa"
model = "ioThinx 45MR-6600"
description = "6-RTD input ioThinx 45MR slot module. Addresses are module-relative; actual PDU address = slot_base + relative_address. FC01: rtdResetMinValue ch0-5 (W=1 to reset), rtdResetMaxValue ch0-5 (W=1 to reset). FC03: rtdResetMinValueAll (rel 0), rtdResetMaxValueAll (rel 1). FC04: rtdValueScaled ch0-5 (f32 2-regs/ch = 12 regs), rtdValueScaledMin (12 regs), rtdValueScaledMax (12 regs), rtdType ch0-5 (0=PT50 1=PT100 2=PT200 3=PT500 4=PT1000 14=310Ohm 15=620Ohm 16=1250Ohm 17=2200Ohm 20=JPT100 21=JPT200 22=JPT500 23=JPT1000 30=NI100 31=NI200 32=NI500 33=NI1000 34=NI120), rtdStatus ch0-5 (0=normal 1=burnout)."

# ===== FC03 Holding Registers (module-relative addresses) =====

[[registers]]
address = 0
type = "u16"
name = "rtdResetMinValueAll (bitmask bit0-5=ch0-5; W=1 to reset min-value tracking; R/W)"

[[registers]]
address = 1
type = "u16"
name = "rtdResetMaxValueAll (bitmask bit0-5=ch0-5; W=1 to reset max-value tracking; R/W)"
