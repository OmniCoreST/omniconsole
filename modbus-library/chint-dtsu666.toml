# Chint DTSU666 — Modbus register map for Omni Console
#
# Source: chint-dtsu666-manual.pdf
# - 3-phase 4-wire DIN-rail energy meter (star connection, neutral available).
# - Holding registers, FC03. Big-endian word order (MSW first).
# - f32 values carry embedded scale: V×0.1, A×0.001, W/var×0.1, PF×0.001, Hz×0.01.
# - Energy registers contain direct kWh values (no scale).
# - Factory defaults: slave=1, baud=9600, 8E1.

vendor = "Chint"
model = "DTSU666"
description = "3-phase 4-wire DIN-rail energy meter — Uab/Ubc/Uca and Ua/Ub/Uc, I per phase, active/reactive power, PF, frequency, import/export energy per phase and total."

# ----- Line-to-line voltages -----
[[registers]]
address = 8192
type = "f32"
name = "Voltage Uab"
unit = "V"
scale = 0.1

