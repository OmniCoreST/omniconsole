# Moxa ioThinx 45MR-1601 — 16-channel DI (NPN source)
#
# Source: ioThinx 4510 Series User's Manual V2.1, August 2019, Appendix A
# Protocol: Modbus/TCP via ioThinx 4510 adapter, port 502
#
# Identical register map to 45MR-1600; differs only in input polarity (NPN source vs PNP sink).
# IMPORTANT: Addresses are MODULE-RELATIVE. Actual PDU address = slot_base + relative_address.
# Only ch0-3 support event counter mode; ch4-15 are standard DI only.
#
# FC01 (coil R/W): diCounterStatus ch0-3 (4 BOOL, 0=Pause 1=Run),
#   diCounterOverflowFlagClear ch0-3 (4 BOOL, W=1 to clear)
# FC02 (discrete input R): diStatus ch0-15 (16 BOOL, 0=OFF 1=ON),
#   diMode ch0-15 (16 BOOL, 0=DI 1=Counter), diCounterOverflowFlag ch0-3 (4 BOOL, 0=Normal 1=Overflow)
# FC03 (holding R/W): see [[registers]] below
# FC04 (input R): diStatusAll (1 WORD bitmask ch0-15), diCounterOverflowFlagAll (1 WORD bitmask ch0-3),
#   diModeAll (1 WORD bitmask ch0-15)

vendor = "Moxa"
model = "ioThinx 45MR-1601"
description = "16-DI NPN source input ioThinx 45MR slot module. Register map identical to 45MR-1600; differs only in input polarity. Addresses are module-relative; actual PDU address = slot_base + relative_address (slot base assigned dynamically by ioThinx 4510 chassis). Only ch0-3 support event counter mode; ch4-15 are DI-only. FC01: diCounterStatus ch0-3, diCounterOverflowFlagClear ch0-3. FC02: diStatus ch0-15, diMode ch0-15, diCounterOverflowFlag ch0-3. FC03: diCounterValue ch0-3 u64 (rel 0-15), diCounterStatusAll (rel 16), diCounterOverflowFlagClearAll (rel 17). FC04: diStatusAll, diCounterOverflowFlagAll, diModeAll."

# ===== FC03 Holding Registers (module-relative addresses) =====

# DI counter value ch0-3 (u64 per channel, 4 x u16 words each, rel 0-15)
[[registers]]
address = 0
type = "u16"
name = "diCounterValue ch0 word[0] (u64 hi-DWORD hi-word; R)"

[[registers]]
address = 1
type = "u16"
name = "diCounterValue ch0 word[1] (u64 hi-DWORD lo-word)"

[[registers]]
address = 2
type = "u16"
name = "diCounterValue ch0 word[2] (u64 lo-DWORD hi-word)"

[[registers]]
address = 3
type = "u16"
name = "diCounterValue ch0 word[3] (u64 lo-DWORD lo-word)"

[[registers]]
