# ENTES EPR-04S Powermeter (Modbus RTU RS-485)
#
# Source: entes-epr-04s-modbus-register-map-en.pdf (A3928/Rev.1)
# Protocol: Modbus RTU; FC03 read, FC06 write single register
# Baud: 1=38400, 2=19200, 3=9600, 4=4800, 5=2400 bps
# All addresses are 0-based decimal. Addr 0-20 reserved/empty.
# Power: ×0.1 unit (e.g. raw 2300 W = 230.0 W).
# COSφ: ×0.001 (raw -1000 to 1000 = -1.000 to 1.000).
# Frequency: ×0.01 Hz.
# Energy: 64-bit accumulator stored as two consecutive u32 (low word at base, high word at base+2).
# VT ratio: ×0.1 (e.g. raw 1000 = ratio 100.0); CT ratio: ×1.

vendor = "ENTES"
model = "EPR-04S"
description = "3-phase powermeter, Modbus RTU. Per-phase active/reactive/apparent power at addr 22-38 (W/VAr/VA ×0.1); per-phase cos-phi at 40-44 (×0.001); total import active/inductive reactive/capacitive reactive/apparent at 46-52; avg cos-phi at 54-56; frequency at 58; digital input at 84; energy counters (import/export active, reactive, 64-bit each) at 86-116; min power at 136-162; max power at 184-210; max demand at 216-254. Settings: VT/CT ratio at 32768-32769, calculation method at 32770, demand time at 32771, pulse outputs at 32773-32775, energy counter selection at 32776-32777, comms at 32778-32780."

