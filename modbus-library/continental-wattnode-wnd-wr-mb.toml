# Continental Control Systems WattNode WND-WR-MB — Wide-Range 3-Phase Energy Meter (Modbus RTU/TCP)
#
# Source: continental-wattnode-wnd-wr-mb-reference-manual.pdf (sections 4.2.5-4.4, pp. 35-54)
# Models: WND-WR-MB (single model, wide-range 120-600 Vac line-to-neutral)
# Protocol: Modbus RTU or TCP; FC03/FC04 read (interchangeable), FC06/FC16 write
# Baud: configurable; default 9600 8N1; 1200-115200 via register 1652
# Register numbering: source uses 1-based numbers; TOML addresses are 0-based (source - 1).
# 32-bit values: low 16 bits at the listed address, high 16 bits at address+1 (little-endian words).
# Floating point: IEEE 754 f32, low word first.
# Integer energy (s32): units of 0.1 kWh, 0.1 kVARh, or 0.1 kVAh.
# Integer power (s16): units of PowerIntScale watts (reg 1608, default auto).
# Integer voltage (s16): units of 0.1 V. Integer frequency (s16): units of 0.1 Hz.
# Integer power factor (s16): units of 0.01.
# Integer current (s16): scaled by CtAmps/CurrentIntScale.
# Key difference from WNC: "element 1/2/3" terminology (CT inputs), VoltAN/BN/CN naming,
# positive/negative reactive energy registers, PowerFast registers, wide voltage range.

vendor = "Continental Control Systems"
model = "WattNode WND-WR-MB"
description = "Wide-range 3-phase energy meter, Modbus RTU/TCP. FC03/04 read, FC06/16 write. Basic FP (f32): energy kWh at 1000-1006, power W at 1008-1014, voltage V at 1016-1030, freq at 1032. PowerFast (10 Hz, f32 only) at 1034-1042. Advanced FP: per-element energy net/pos/neg at 1100-1120, reactive energy net/pos/neg at 1122-1196, apparent at 1130-1136, PF at 1138-1144, reactive/apparent power at 1146-1160, current at 1162-1166, demand at 1168-1180. Integer equivalents at 1200-1220 (basic) and 1300-1377 (advanced). Config at 1600-1685. Comms at 1650-1658. Diagnostics at 1700-1761."

