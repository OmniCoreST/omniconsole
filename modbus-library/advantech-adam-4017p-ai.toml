# Advantech ADAM-4017+ — 8-Channel Analog Input Module
#
# Source: advantech-adam-4000-modbus.pdf (Appendix G, Module 3)
# - 8-channel analog input, ±150mV/±500mV/±1V/±5V/±10V/0-20mA/4-20mA (range per type code).
# - Modbus RTU, FC03.
# - FC03 40001-40008 (addr 0-7): Current Value ch0-7 (s16, raw ±32000 = full scale).
# - FC03 40201-40208 (addr 200-207): Type Code ch0-7, R/W.
# - FC03 40221 (addr 220): Channel Enable bitmask.
# - Actual engineering value = raw × (full_scale / 32000); full scale depends on type code.
# - Factory defaults: slave=1, 9600 baud, 8N1.

vendor = "Advantech"
model = "ADAM-4017+"
description = "8-channel analog input module (s16 raw ±32000 = full scale, FC03, addr 0-7). Scale depends on range type code. Type code at addr 200-207 (FC03, R/W)."

