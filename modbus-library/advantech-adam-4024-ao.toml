# Advantech ADAM-4024 — 4-Channel Analog Output Module
#
# Source: advantech-adam-4000-modbus.pdf (Appendix G, Module 6)
# - 4-channel analog output (4-20mA / 0-20mA / 0-10V / 0-5V selectable per type code).
# - Modbus RTU, FC01/FC03/FC06.
# - FC01 00001-00004 (addr 0-3): Emergency DI Input Flag (read-only coils).
# - FC03 40001-40004 (addr 0-3): Current Output Value ch0-3 (u16, R/W).
# - FC03 40201-40204 (addr 200-203): Type Code ch0-3, R/W.
# - FC03 40215 (addr 214): Comm Safety Enable (R/W).
# - FC03 40221 (addr 220): Channel Enable bitmask (R/W).
# - Factory defaults: slave=1, 9600 baud, 8N1.

vendor = "Advantech"
model = "ADAM-4024"
description = "4-channel analog output module (4-20mA/0-10V/0-5V selectable, u16 raw, FC03, addr 0-3). Type code at addr 200-203. Emergency DI flag via FC01 addr 0-3 (coil)."

# ----- Output (FC03, R/W) -----
[[registers]]
address = 0
type = "u16"
name = "Ch0 output value"

[[registers]]
address = 1
type = "u16"
name = "Ch1 output value"

[[registers]]
address = 2
type = "u16"
name = "Ch2 output value"

[[registers]]
address = 3
type = "u16"
name = "Ch3 output value"

# ----- Configuration (FC03, R/W) -----
[[registers]]
address = 200
type = "u16"
name = "Ch0 type code"

[[registers]]
address = 201
type = "u16"
name = "Ch1 type code"

[[registers]]
address = 202
type = "u16"
name = "Ch2 type code"

[[registers]]
address = 203
type = "u16"
name = "Ch3 type code"

[[registers]]
address = 214
type = "u16"
name = "Comm safety enable"

[[registers]]
address = 220
type = "u16"
name = "Channel enable bitmask"
