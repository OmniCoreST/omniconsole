# Janitza UMG 96RM-PN — Modbus register map for Omni Console
#
# Source: janitza-mal-umg96rmpn-en.pdf ("Modbus address list").
# - All measured values are IEEE-754 FLOAT (f32), 2 registers, Big-Endian (manual §
#   "addresses ... supply the data in the Big-Endian format"). `word_order` therefore
#   defaults to "be" and is omitted below; values are in engineering units (no scale).
# - Measured values update every 200 ms. Read with FC03 (holding) or FC04 (input).
# - Factory defaults: device address (slave) = 1, RTU baud = 115.2 kbps, 8N2.
# - Addresses are the Modbus protocol addresses, in decimal, as printed in the manual.
#
# Workspace fields below activate in Phase 1 (currently ignored by the build):
# pinned = [800, 808, 810, 812, 860, 862, 864, 874, 882, 890, 834]
# poll_interval_ms = 1000
# slave = 1

vendor = "Janitza"
model = "UMG 96RM-PN"
description = "Power quality analyser — instantaneous measurements + energy totals (float, BE)."

# ----- Frequency -----
[[registers]]
address = 800
type = "f32"
name = "Frequency"
unit = "Hz"

