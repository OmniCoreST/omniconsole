# ENTES EPM-04CS / EPM-06CS Multimeter (Modbus RTU RS-485)
#
# Source: entes-epm-04cs-epm-06cs-register-table.pdf (A4263/Rev.2)
# Models: EPM-04CS (3-phase multimeter), EPM-06CS (adds cos-phi, angles, harmonics)
# Protocol: Modbus RTU, FC03 read holding registers, FC06 write single register
# Baud: 0=9600, 1=4800, 2=2400, 3=19200, 4=4800, 5=38400 bps; default 9600 8N2
# All addresses are 0-based decimal.
# Multiplier applies to raw value: e.g. voltage raw 2300 × 0.1 = 230.0 V
# ★ = EPM-06CS only

vendor = "ENTES"
model = "EPM-04CS/EPM-06CS"
description = "3-phase multimeter, Modbus RTU. Phase-neutral voltages at addr 0-4 (V ×0.1); phase currents at 6-12 (A ×0.001); phase-phase voltages at 14-18; cos-phi per phase at 38-42 (★); avg cos-phi at 54-56 (★); frequency at 58 (Hz ×0.01); voltage/current angles at 60-70 (★). Min measurements at 118-136; max at 168-182; max current demand at 204/212/220. Settings: VT/CT ratio at 32766/32769, demand time at 32771, comms at 32777-32784. Alarm functions at 33026+; warning setpoints at 33046+; tripping/releasing times at 33070+."

# ----- Phase-Neutral voltages (FC03, R, u16, ×0.1 V) -----
[[registers]]
address = 0
type = "u16"
name = "L1 phase voltage"

[[registers]]
address = 2
type = "u16"
name = "L2 phase voltage"

[[registers]]
address = 4
type = "u16"
name = "L3 phase voltage"

