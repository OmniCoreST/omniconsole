# ABB A43/A44 — Modbus register map for Omni Console
#
# Source: abb-a43-a44-manual.pdf (Doc ID 2CMC484001M0201 Rev E, 2025-11-07)
# - 3-phase energy and power quality meter, panel-mount, RS485 Modbus RTU.
# - Holding registers FC03 (all measurement/energy registers are read-only).
# - "Start Reg (Hex)" is the raw protocol address — NOT 40000-based, NOT decremented by 1.
# - All multi-register values: Big-Endian (MSW first); no word_order needed.
# - Size 1 register = 16-bit (u16/s16), Size 2 = 32-bit (u32/s32), Size 4 = 64-bit (u64/s64).
# - Factory defaults: slave=1, configurable baud, 8N1.

vendor = "ABB"
model = "A43/A44"
description = "3-phase energy and power quality meter — per-phase V/I/P/Q/S/PF, phase angles, neutral current, frequency, 64-bit energy import/export/net (FC03, Big-Endian, 0x5Bxx instantaneous, 0x50xx energy)."

# ----- Energy accumulators (total) — 64-bit, res 0.01 -----
# 0x5000 = 20480
[[registers]]
address = 20480
type = "u64"
name = "Active energy import"
unit = "kWh"
scale = 0.01

[[registers]]
