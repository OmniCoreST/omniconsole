# Eastron SDM630 (Modbus / Modbus-V2) — Modbus register map for Omni Console
#
# Source: Eastron "SDM630 Modbus Protocol" (V1.x) input-register table.
# - All measured values are IEEE-754 FLOAT (f32), 2 registers, most-significant
#   register first (Big-Endian) — `word_order` defaults to "be" and is omitted.
#   (The meter's "Register Order" holding register can flip this to LSW-first; if
#   your meter is set to "reversed", add `word_order = "le"` to every entry.)
# - Measurements live in the INPUT registers (read with FC04), so `area = "input"`.
#   Addresses are the raw protocol addresses, in decimal (e.g. 0x0000 = 0).
#   Read in even register pairs; max 80 registers per request.
# - Energy registers report directly in kWh / kVArh / kVAh / Ah (no scale).
# - Factory defaults: device address (slave) = 1, RTU = 9600 baud, 8N1.
#
# Workspace fields below activate in Phase 1 (currently ignored by the build):
# pinned = [0, 6, 52, 70, 72, 74]
# poll_interval_ms = 1000
# slave = 1

vendor = "Eastron"
model = "SDM630"
description = "3-phase DIN-rail energy meter — V/I/P/Q/S, power factor, frequency and energy totals (IEEE-754 float, input registers)."

# ----- Voltages, phase-to-neutral -----
[[registers]]
address = 0
area = "input"
type = "f32"
name = "Voltage L1-N"
unit = "V"

