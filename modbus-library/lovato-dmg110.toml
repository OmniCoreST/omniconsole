unit = "V"
scale = 0.01

[[registers]]
address = 15
type = "u32"
word_order = "le"
name = "Voltage L2-L3"
unit = "V"
scale = 0.01

[[registers]]
address = 17
type = "u32"
word_order = "le"
name = "Voltage L3-L1"
unit = "V"
scale = 0.01

