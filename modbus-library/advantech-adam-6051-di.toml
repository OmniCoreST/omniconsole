# Advantech ADAM-6051 — 14DI / 2DO Digital Input Module with Counter/Pulse (Ethernet/Modbus TCP)
#
# Source: advantech-adam-6000-modbus.pdf (Appendix B.2)
# - 14 digital inputs (DI) + 2 pulse digital outputs (DO); each DI configurable as counter/frequency.
# - Modbus TCP (Ethernet), unit identifier = 1.
# - FC02 addr 0-13 (00001-00014): DI value ch 0-13 (R).
# - FC01 counter coils per DI ch (4 coils each):
#     ch 0: addr 32-35 (start/stop, clear, clear-overflow, latch); ... ch 13: addr 84-87.
# - FC01 addr 300-307 (00301-00308): Clear GCL internal counter ch 0-7 (Write).
# - FC03 addr 0-27: Counter/Frequency ch 0-13 (u32, 2 regs each; Freq = value/10 Hz) (R).
# - FC03 addr 28-31: Pulse output low-level width ch 0-1 (u32, unit 0.1ms) (R/W).
# - FC03 addr 32-35: Pulse output high-level width ch 0-1 (u32) (R/W).
# - FC03 addr 36-39: Set absolute pulse count ch 0-1 (u32; 0=continuous mode) (R/W).
# - FC03 addr 40-43: Set incremental pulse count ch 0-1 (u32) (R/W).
# - FC03 addr 210-211: Module Name 1-2 (R).
# - FC03 addr 300: DI data word (R); addr 302: DO data word (R/W).
# - FC03 addr 304: GCL internal flag value (0~15) (R/W).
# - FC03 addr 306: DO diagnostic status (D version or later) (R).
# - FC03 addr 310-325: GCL internal counter value ch 0-7 (u32) (R).

vendor = "Advantech"
model = "ADAM-6051"
description = "14DI + 2DO digital I/O with counter/frequency and pulse output over Modbus TCP. DI at FC02 coil addr 0-13. FC03 addr 0-27: counter/freq u32 (14ch). FC03 addr 300: DI word; addr 302: DO word."

