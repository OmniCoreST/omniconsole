# Inepro Metering PRO380 — Modbus register map for Omni Console
#
# Source: inepro-pro380-modbus-register-list.pdf
# - 3-phase DIN-rail energy meter with RS485 Modbus.
# - All values: Float ABCD (IEEE-754 f32), MSW first (big-endian) — word_order omitted.
# - Holding registers, FC03. Addresses are raw hex protocol addresses in decimal.
# - Power values are in kW / kvar / kVA (not W), energy in kWh / kvarh.
# - Factory defaults: slave=1, baud=9600, 8E1.

vendor = "Inepro Metering"
model = "PRO380"
description = "3-phase DIN-rail energy meter — V/I/P/Q/S per phase and total, PF, frequency, forward/reverse import/export energy per phase and tariff (IEEE-754 float, holding registers)."

