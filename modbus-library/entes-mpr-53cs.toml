type = "s32"
name = "Total power factor"

# Frequency (u32, ×0.01 Hz)
[[registers]]
address = 52
type = "u32"
name = "Frequency"

# ----- Setpoints (FC03/06, R/W) — 10 setpoints at addr 32768-32847 -----
# Each setpoint: 8 consecutive registers (activation, parameter type, high/low set,
# fail delay, recovery delay, hysteresis value, output number)
# ACTIVATION encoding: high byte A = threshold type, low byte B = 0 disabled/1 low/2 high
# Set A=BB (A==B) to disable setpoint

[[registers]]
address = 32768
type = "u16"
name = "Setpoint 1 activation"

[[registers]]
address = 32769
type = "u16"
name = "Setpoint 1 parameter type"

[[registers]]
address = 32770
type = "u16"
name = "Setpoint 1 high set value"

[[registers]]
address = 32771
type = "u16"
name = "Setpoint 1 low set value"

[[registers]]
address = 32772
type = "u16"
name = "Setpoint 1 fail to trip delay"

[[registers]]
address = 32773
type = "u16"
name = "Setpoint 1 recovery delay"

[[registers]]
address = 32774
type = "u16"
name = "Setpoint 1 hysteresis value"

# 0=Output1..7=Output8
[[registers]]
