name = "Reactive power L2"

[[registers]]
address = 34
type = "s32"
name = "Reactive power L3"

# Apparent power (u32, ×0.01 VA)
[[registers]]
address = 36
type = "u32"
name = "Total apparent power"

[[registers]]
address = 38
type = "u32"
name = "Apparent power L1"

[[registers]]
address = 40
type = "u32"
name = "Apparent power L2"

[[registers]]
address = 42
type = "u32"
name = "Apparent power L3"

# Power factor (s32, ×0.001, signed)
[[registers]]
