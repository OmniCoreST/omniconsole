# Carlo Gavazzi EM330 — Modbus register map for Omni Console
#
# Source: carlo-gavazzi-em330-em340-et330-et340-modbus.pdf (EM300/ET300 Series V2 Rev.17)
# - 3-phase energy meter. Register map is identical to EM340 with two additions:
#   - Run hour meter at address 90 (0x5A) — hours*100, scale=0.01
#   - Neutral current An at address 152 (0x98) — A*1000, scale=0.001
# - INT32 word order: LSW->MSW (little-endian) → word_order = "le".
# - INT16: single word (PF, Hz, phase sequence) — no word_order.
# - FC03 and FC04 return identical data.
# - Factory defaults: slave=1, baud=9600, 8N2.

vendor = "Carlo Gavazzi"
model = "EM330"
description = "3-phase DIN-rail energy meter with neutral current — V/I/P/Q/S, PF, frequency, energy (scaled INT32 LSW-first). Adds neutral current and run-hour meter vs EM340."

