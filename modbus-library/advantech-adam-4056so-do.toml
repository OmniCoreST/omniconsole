# Advantech ADAM-4056SO — 12-Channel Source-type Isolated Digital Output Module
#
# Source: advantech-adam-4000-modbus.pdf (Appendix G, Module 13)
# - 12-channel source-type isolated digital output with over-current protection.
# - Modbus RTU, FC01 for output state (coil registers — NOT FC03).
# - FC01 00017-00028 (coil addr 16-27): Digital Output Value ch0-11 (R/W).
# - FC01 00029 (coil addr 28): Over Current Flag CH0-3 (R/W).
# - FC01 00030 (coil addr 29): Over Current Flag CH4-7 (R/W).
# - FC01 00031 (coil addr 30): Over Current Flag CH8-11 (R/W).
# - FC03 40211 (addr 210): Module Name 1 (R, 0x40 0x56).
# - FC03 40212 (addr 211): Module Name 2 (R, 0x53 0x4F).
# - FC03 40213 (addr 212): Firmware Version 1 (R).
# - FC03 40214 (addr 213): Firmware Version 2 (R).
# - FC03 40215 (addr 214): Comm Safety Enable (R).
# - FC03 40216 (addr 215): Comm Safety Flag (R).
# - Factory defaults: slave=1, 9600 baud, 8N1.

vendor = "Advantech"
model = "ADAM-4056SO"
description = "12-channel source-type isolated digital output module with over-current protection. DO at FC01 coil addr 16-27, over-current flags at FC01 coil addr 28-30. FC03 module ID/comm-safety at addr 210-215."

# ----- Module identification / comm safety (FC03, R) -----
[[registers]]
address = 210
type = "u16"
name = "Module name 1"

[[registers]]
address = 211
type = "u16"
name = "Module name 2"

[[registers]]
address = 212
type = "u16"
name = "Firmware version 1"

[[registers]]
address = 213
type = "u16"
name = "Firmware version 2"

[[registers]]
address = 214
type = "u16"
name = "Comm safety enable"

[[registers]]
address = 215
type = "u16"
name = "Comm safety flag"
