# Carlo Gavazzi EM340 — Modbus register map for Omni Console
#
# Source: carlo-gavazzi-em330-em340-et330-et340-modbus.pdf (EM300/ET300 Series V2 Rev.17)
# - 3-phase energy meter, direct or CT connection (AV5/AV6/AV2 variants).
# - INT32/UINT32/INT64: word order is LSW->MSW (little-endian) → word_order = "le" for all 32/64-bit.
# - INT16: single word, no word_order needed.
# - Physical address (0-based) is used directly in the Modbus frame.
#   FC03 and FC04 return identical data.
# - Scale factors: V*10→0.1  A*1000→0.001  W/VA/var*10→0.1  PF*1000→0.001  Hz*10→0.1  kWh/kvarh*10→0.1
# - Factory defaults: slave=1, baud=9600, 8N2 (no parity, 2 stop bits).

vendor = "Carlo Gavazzi"
model = "EM340"
description = "3-phase DIN-rail energy meter — V/I/P/Q/S per phase and total, PF, frequency, imported/exported energy (scaled INT32 LSW-first)."

