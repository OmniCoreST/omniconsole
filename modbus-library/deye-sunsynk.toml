# Deye / Sunsynk String & Hybrid Solar Inverter (Modbus RTU RS-485)
#
# Source: deye-sunsynk-modbus-protocol.pdf
# Models: Deye/Sunsynk string inverters (3-phase and split-phase hybrid variants)
# Protocol: Modbus RTU, FC03 read, FC10 write
# Baud: configurable (register 38 readable); default 9600 8N1
# All addresses are decimal.
# Types: u16 default; s16 where signed; u32/s32 for 32-bit (low word first).
# Temperature registers use +1000 offset (e.g. 1150 = 115.0°C).
# Power factor register 39 uses +1000 offset (1000=0, 1982=0.982, 18=−0.982).

vendor = "Deye"
model = "Sunsynk Inverter"
description = "Deye/Sunsynk solar inverter, Modbus RTU RS-485. FC03 read, FC10 write. Identity/config at addr 0-57 (device type, S/N, rated power, grid limits, comms, PF/power regulation). Run state at 59. Day/total energy at 60-68. Grid voltages at 70-75; grid currents at 76-78; grid freq at 79. 3-phase output power at 80-89; temperatures at 90-95; PV history energy at 96-97. Fault/warning at 100-106. DC MPPT V/I at 109-116. Split-phase grid/inverter/load voltages at 150-158; currents at 160-165; powers at 167-178. Battery data at 182-191. PV input power at 186-189. Load/meter/grid energy at 198-210."

