# Advantech ADAM-4080 — 2-Channel Counter/Frequency Module
#
# Source: advantech-adam-4000-modbus.pdf (Appendix G, Module 16)
# - 2-channel counter/frequency input + 2 digital outputs.
# - Modbus RTU, FC01 for coil control; FC03 for counter values and configuration.
# - FC01 00017 (coil addr 16): DO0 / Counter0 Alarm Status (R/W).
# - FC01 00018 (coil addr 17): DO1 / Counter1 Alarm Status (R/W).
# - FC01 00033 (coil addr 32): Counter0 Start/Stop (R/W, 1=start, 0=stop).
# - FC01 00034 (coil addr 33): Counter0 Clear (W, 1=clear).
# - FC01 00035 (coil addr 34): Counter0 Overflow (R).
# - FC01 00037 (coil addr 36): Counter1 Start/Stop (R/W).
# - FC01 00038 (coil addr 37): Counter1 Clear (W).
# - FC01 00039 (coil addr 38): Counter1 Overflow (R).
# - FC03 40001-40002 (addr 0-1): Counter 0 Value (u32, 2 registers).
# - FC03 40003-40004 (addr 2-3): Counter 1 Value (u32, 2 registers).
# - FC03 40201 (addr 200): Counter Mode (R, 50=Counter, 51=Frequency).
# - FC03 40202 (addr 201): Signal Input Mode (R, 0=TTL non-isolated, 1=photo-isolated).
# - FC03 40203 (addr 202): Gate Mode (R, 0=gate low, 1=gate high, 2=gate disabled).
# - FC03 40204 (addr 203): Gate Time (R, 0=0.1s, 1=1s).
# - FC03 40205 (addr 204): Counter 0 Alarm output enable (R).
# - FC03 40206 (addr 205): Counter 1 Alarm output enable (R).
# - FC03 40211 (addr 210): Module Name 1 (R).
# - FC03 40213 (addr 212): Firmware Version 1 (R).
# - Factory defaults: slave=1, 9600 baud, 8N1.

vendor = "Advantech"
model = "ADAM-4080"
description = "2-channel counter/frequency input + 2 DO module. Counter values as u32 at FC03 addr 0-3. Counter/frequency mode selectable per addr 200. DO and counter control via FC01 coils."

# ----- Counter values (FC03, R) -----
[[registers]]
address = 0
type = "u32"
name = "Counter 0 value"

[[registers]]
address = 2
type = "u32"
name = "Counter 1 value"

# ----- Configuration (FC03, R) -----
[[registers]]
address = 200
type = "u16"
name = "Counter mode"

[[registers]]
address = 201
type = "u16"
name = "Signal input mode"

[[registers]]
address = 202
type = "u16"
name = "Gate mode"

[[registers]]
address = 203
type = "u16"
name = "Gate time"

[[registers]]
address = 204
type = "u16"
name = "Counter 0 alarm output enable"

[[registers]]
address = 205
type = "u16"
name = "Counter 1 alarm output enable"

[[registers]]
address = 210
type = "u16"
name = "Module name 1"

[[registers]]
address = 212
type = "u16"
name = "Firmware version 1"
